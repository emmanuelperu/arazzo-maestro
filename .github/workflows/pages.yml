# Deploy the promotional landing page (docs/index.html, static, no build
# step) and its screenshots to GitHub Pages.
#
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions".
#
# Third-party actions are pinned to a full commit SHA (with the
# human-readable version in a trailing comment) to satisfy Scorecard
# `Pinned-Dependencies`. Dependabot bumps both fields on upstream
# releases.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege by default; the deploy job widens what it needs.
permissions:
  contents: read

# Never run two Pages deploys at once; let a newer one supersede.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard, eco-design invariants must hold
        run: |
          f=docs/index.html
          fail=0
          if grep -q "cdn.tailwindcss.com" "$f"; then echo "::error file=$f::Tailwind CDN reference leaked (eco-design R1: 0 requests)"; fail=1; fi
          if grep -q "<script" "$f"; then echo "::error file=$f::<script> found, the page must stay JavaScript-free"; fail=1; fi
          if grep -Eq 'https?://[^"]+\.(css|js|woff2?)' "$f"; then echo "::error file=$f::external stylesheet, script or font referenced, the page must load local assets only"; fail=1; fi
          raw=$(wc -c < "$f"); gz=$(gzip -c "$f" | wc -c)
          echo "index.html: ${raw} B raw / ${gz} B gzipped"
          exit $fail

      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -r docs/screenshots _site/screenshots

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write          # to deploy to Pages
      id-token: write       # to verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
