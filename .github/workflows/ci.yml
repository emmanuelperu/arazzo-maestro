# Run on every push to main and on every pull request.
#
# Mirrors what `make test vet lint dist` does locally — anything green
# in CI must also be green when a contributor runs `make` on their
# machine, and vice-versa.
#
# Third-party actions are pinned to a full commit SHA (with the
# human-readable version in a trailing comment) to satisfy Scorecard
# `Pinned-Dependencies`. Dependabot (`.github/dependabot.yml`) bumps
# both the SHA and the comment when upstream cuts a new release.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default.
permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tells whether a pull request touches anything besides docs/ and
  # Markdown. Pushes to main always count as code changes, and so does
  # any failure to list the files.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: List changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Branch protection requires "test (macos-latest)", so a docs-only pull
    # request still reports that check, from an Ubuntu runner that skips
    # every step: a skipped matrix job would never report its expanded name.
    runs-on: ${{ (matrix.os == 'macos-latest' && needs.changes.outputs.code != 'true') && 'ubuntu-latest' || matrix.os }}
    env:
      RUN: ${{ matrix.os != 'macos-latest' || needs.changes.outputs.code == 'true' }}
    steps:
      - name: Skip the macOS build for a docs-only change
        if: env.RUN != 'true'
        run: echo "::notice::Only docs/ or Markdown changed, macOS build skipped"

      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: env.RUN == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        if: env.RUN == 'true'
        run: go vet ./...

      - name: go test
        if: env.RUN == 'true'
        run: go test -race -cover ./...

      - name: go build
        if: env.RUN == 'true'
        run: go build -o /tmp/arazzo-maestro ./cmd/arazzo-maestro

      - name: Lint the demo Arazzo files
        if: env.RUN == 'true'
        run: |
          for f in examples/*.arazzo.yaml; do
            echo "→ lint $f"
            /tmp/arazzo-maestro lint "$f"
          done

      - name: Render the demo files (eco-design guard)
        if: env.RUN == 'true'
        run: |
          /tmp/arazzo-maestro view examples/shop.arazzo.yaml -o /tmp/dist/shop --theme light
          for f in /tmp/dist/shop/*.html; do
            if grep -q "ZgotmplZ" "$f"; then echo "::error file=$f::ZgotmplZ leaked"; exit 1; fi
          done

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # The action major is kept in sync with the binary major:
        # action @v9 supports golangci-lint v2.x (which our
        # .golangci.yml requires — `version: "2"` header). Earlier
        # action majors (@v6 and below) only accept v1.x binaries.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.x is required because our .golangci.yml uses the v2
          # format and our go.mod targets Go 1.26 — the v1.64.x line
          # is built with Go 1.24 and refuses to lint newer modules.
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck ./...
        run: govulncheck ./...
